services:
  - type: web
    name: ai-rag-workspace
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        value: 8000
      - key: EMBEDDING_MODEL_NAME
        value: all-MiniLM-L6-v2
